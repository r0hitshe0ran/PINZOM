
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories | Pinzom</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="page-categories">


<header class="site-header">
  <div class="site-nav">
    <a class="logo" href="index.html" aria-label="Pinzom home">pinzom<span>•</span></a>
    <nav class="nav-links" id="navLinks" aria-label="Main navigation">
      <a href="index.html">Discover</a>
      <a href="how-it-works.html">How It Works</a>
      <a href="explore.html">Explore</a>
      <a href="categories.html" class="active" aria-current="page">Categories</a>
      <a href="reviews.html">Reviews</a>
    </nav>
    <a class="login-link" href="login.html">Log in</a>
    <button class="menu-toggle" type="button" aria-controls="navLinks"
      aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
</header>

<main class="category-page">


  <section class="container section-heading">

    <h1>Browse by category</h1>

    <p>
      Whatever you're craving - pick a category to see what's nearby.
    </p>

  </section>


  <section class="container category-experience"
    aria-label="Bakery categories">


    <div class="category-selector">


      <button
        class="category-card is-active"
        type="button"
        data-category="cakes"
        aria-pressed="true">

        <h2>Cakes</h2>

        <p>
          Birthday cakes, custom orders, and slices by the piece.
        </p>

        <span class="count">2 bakeries</span>
      </button>


      <button
        class="category-card"
        type="button"
        data-category="pastries"
        aria-pressed="false">

        <h2>Pastries</h2>

        <p>
          Croissants, danishes, and other flaky, buttery things.
        </p>

        <span class="count">2 bakeries</span>
      </button>


      <button
        class="category-card"
        type="button"
        data-category="donuts"
        aria-pressed="false">

        <h2>Donuts</h2>

        <p>
          Glazed, filled, and everything in between.
        </p>

        <span class="count">1 bakery</span>
      </button>


      <button
        class="category-card"
        type="button"
        data-category="cookies"
        aria-pressed="false">

        <h2>Cookies</h2>

        <p>
          Classic chocolate chip to unusual flavors.
        </p>

        <span class="count">1 bakery</span>
      </button>

      <button class="category-card" type="button" data-category="cafes" aria-pressed="false">
        <h2>Cafés</h2>
        <p>Specialty coffee, brunch, and places to sit down in Gurugram.</p>
        <span class="count">7 cafés</span>
      </button>

    </div>


    <figure class="category-visual"
      aria-label="Selected bakery category">

      <div class="category-image-holder">

        <img
          class="category-image is-visible"
          data-category-image="cakes"
          src="images/categories_cake.png"
          alt="A decorated chocolate cake">

        <img
          class="category-image"
          data-category-image="pastries"
          src="images/categories_pastry.png"
          alt="A selection of golden pastries">

        <img
          class="category-image"
          data-category-image="donuts"
          src="images/categories_donuts.png"
          alt="Glazed donuts">

        <img
          class="category-image"
          data-category-image="cookies"
          src="images/categories_cookies.png"
          alt="Chocolate chip cookies">

        <img class="category-image" data-category-image="cafes"
          src="images/1_Explorepage.png" alt="Café storefront in Gurugram">

      </div>


      <a class="btn category-explore"
         id="categoryExploreLink"
         href="explore.html?category=cakes">
        Explore cakes →
      </a>

    </figure>

  </section>

</main>


<footer class="footer">
  © <span data-year>2026</span> Pinzom · Discover your next favorite bakery.
</footer>

<script src="bakery-catalog.js"></script>
<script src="script.js"></script>

</body>
</html>
