
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />

  <title>Explore Bakeries | Pinzom</title>

  <link rel="stylesheet" href="style.css" />


</head>

<body class="page-explore">


  <header class="site-header">
    <div class="site-nav">
      <a class="logo" href="index.html" aria-label="Pinzom home">pinzom<span>•</span></a>
      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="index.html">Discover</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="explore.html" class="active" aria-current="page">Explore</a>
        <a href="categories.html">Categories</a>
        <a href="reviews.html">Reviews</a>
      </nav>
      <a class="login-link" href="login.html">Log in</a>
      <button class="menu-toggle" type="button" aria-controls="navLinks"
        aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main>


    <section class="container section-heading">

      <h1>Explore bakeries and cafés</h1>

      <p>
        Find bakeries and cafés in Gurugram.
      </p>
      <div class="location-control" data-location-control>
        <button class="location-button" type="button" data-use-location>Use my location</button>
        <div class="location-status" role="status" data-location-status></div>
      </div>

    </section>


    <section class="container explore-layout">


      <aside class="filter-panel">

        <h3>Search &amp; Filter</h3>


        <input
          id="searchBox"
          type="search"
          placeholder="Search by bakery"
          aria-label="Search by bakery"
        />

        <label>Category</label>

        <div
          class="chips explore-filter-list">

          <button
            class="chip selected"
            type="button"
            data-filter="all">
            All
          </button>

          <button
            class="chip"
            type="button"
            data-filter="cakes">
            Cakes
          </button>

          <button
            class="chip"
            type="button"
            data-filter="pastries">
            Pastries
          </button>

          <button
            class="chip"
            type="button"
            data-filter="donuts">
            Donuts
          </button>

          <button
            class="chip"
            type="button"
            data-filter="cookies">
            Cookies
          </button>

          <button class="chip" type="button" data-filter="cafes">Cafés</button>

        </div>

      </aside>


      <div class="bakery-list" id="exploreBakeries">
        <p
          class="empty-state"
          id="noResults"
          hidden>
          No bakeries match your search.
          Try another word or category.
        </p>

      </div>

    </section>

  </main>


  <footer class="footer">
    © <span data-year></span>
    Pinzom · Discover your next favorite bakery.
  </footer>

  <script src="bakery-catalog.js"></script>
  <script src="script.js"></script>

</body>

</html>
