<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Reset Password | Pinzom</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="container nav">
      <a class="logo" href="index.html">pinzom<span>•</span></a>
      <nav class="nav-links">
        <a class="" href="index.html">Discover</a>
        <a class="" href="how-it-works.html">How It Works</a>
        <a class="" href="explore.html">Explore</a>
        <a class="" href="categories.html">Categories</a>
        <a class="" href="reviews.html">Reviews</a>
      </nav>
      <input
        class="search"
        aria-label="Search bakeries"
        placeholder="⌕  Search bakeries near you"
      />
      <a class="login-link" href="login.html">Log in</a>
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        ☰
      </button>
    </header>
    <main>
      <section class="container auth">
        <div>
          <h1>Reset your password</h1>
          <p>Enter your account email and choose a new password.</p>
          <form class="form" data-form="forgot" novalidate>
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@campus.edu"
              autocomplete="email"
              data-rule="email"
            />
            <small class="field-error" data-error-for="email"></small>
            <label for="password">New password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              data-rule="newPassword"
            />
            <small class="field-error" data-error-for="password"></small>
            <label for="confirmPassword">Confirm new password</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="Re-enter the new password"
              autocomplete="new-password"
              data-rule="confirmPassword"
            />
            <small class="field-error" data-error-for="confirmPassword"></small>
            <button class="btn" type="submit">Update password</button>
            <div class="form-msg" role="status" aria-live="polite"></div>
          </form>
          <p>
            Remembered it?
            <a href="login.html" style="color: #d92d6c">Back to log in</a>
          </p>
        </div>
        <div class="auth-visual">
          <img src="images/signup.png" alt="Fresh bakery treats" />
        </div>
      </section>
    </main>
    <footer class="footer">
      © <span data-year></span> Pinzom · Discover your next favorite bakery.
    </footer>
    <script src="script.js"></script>
  </body>
</html>
