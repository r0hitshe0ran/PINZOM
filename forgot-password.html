<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Reset Password | Pinzom</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-auth">
    <header class="site-header">
      <div class="site-nav">
        <a class="logo" href="index.html" aria-label="Pinzom home">pinzom<span>•</span></a>
        <nav class="nav-links" id="navLinks" aria-label="Main navigation">
          <a href="index.html">Discover</a>
          <a href="how-it-works.html">How It Works</a>
          <a href="explore.html">Explore</a>
          <a href="categories.html">Categories</a>
          <a href="reviews.html">Reviews</a>
        </nav>
        <a class="login-link" href="login.html">Log in</a>
        <button class="menu-toggle" type="button" aria-controls="navLinks"
          aria-label="Open menu" aria-expanded="false">☰</button>
      </div>
    </header>
    <main>
      <section class="container auth">
        <div>
          <h1>Reset your password</h1>
          <p>Use the recovery code you received when you created your account.</p>
          <form class="form" data-form="forgot" novalidate>
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@campus.edu"
              autocomplete="email"
              data-rule="email"
            />
            <small class="field-error" data-error-for="email"></small>
            <label for="recoveryCode">Recovery code</label>
            <input id="recoveryCode" name="recoveryCode" autocomplete="off"
              spellcheck="false" maxlength="100" data-rule="required" />
            <small class="field-error" data-error-for="recoveryCode"></small>
            <label for="password">New password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              data-rule="newPassword"
            />
            <small class="field-error" data-error-for="password"></small>
            <label for="confirmPassword">Confirm new password</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="Re-enter the new password"
              autocomplete="new-password"
              data-rule="confirmPassword"
            />
            <small class="field-error" data-error-for="confirmPassword"></small>
            <button class="btn" type="submit">Update password</button>
            <div class="form-msg" role="status" aria-live="polite"></div>
          </form>
          <p>
            Remembered it?
            <a href="login.html" class="accent-link">Back to log in</a>
          </p>
        </div>
        <div class="auth-visual">
          <img src="images/signup.png" alt="Fresh bakery treats" />
        </div>
      </section>
    </main>
    <footer class="footer">
      © <span data-year></span> Pinzom · Discover your next favorite bakery.
    </footer>
    <script src="bakery-catalog.js"></script>
    <script src="script.js"></script>
  </body>
</html>
