<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Log In | Pinzom</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-auth">
    <header class="site-header">
      <div class="site-nav">
        <a class="logo" href="index.html" aria-label="Pinzom home">pinzom<span>•</span></a>
        <nav class="nav-links" id="navLinks" aria-label="Main navigation">
          <a href="index.html">Discover</a>
          <a href="how-it-works.html">How It Works</a>
          <a href="explore.html">Explore</a>
          <a href="categories.html">Categories</a>
          <a href="reviews.html">Reviews</a>
        </nav>
        <a class="login-link" href="login.html">Log in</a>
        <button class="menu-toggle" type="button" aria-controls="navLinks"
          aria-label="Open menu" aria-expanded="false">☰</button>
      </div>
    </header>
    <main>
      <section class="container auth">
        <div>
          <h1>Welcome back!</h1>
          <p>Log in to save bakeries and write reviews.</p>
          <form class="form" data-form="login" novalidate>
            <label for="identifier">Email or Username</label>
            <input
              id="identifier"
              name="identifier"
              placeholder="yourname@college.edu"
              autocomplete="username"
              data-rule="required"
            />
            <small class="field-error" data-error-for="identifier"></small>
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              data-rule="required"
            />
            <small class="field-error" data-error-for="password"></small>
            <p class="auth-forgot">
              <a href="forgot-password.html" class="accent-link"
                >Forgot password?</a
              >
            </p>
            <button class="btn" type="submit">Login to Pinzom</button>
            <div class="form-msg" role="status" aria-live="polite"></div>
          </form>
          <p>
            Don't have an account?
            <a href="signup.html" class="accent-link">Sign up free</a>
          </p>
        </div>
        <div class="auth-visual">
          <img src="images/signup.png" alt="Fresh bakery treats" />
        </div>
      </section>
    </main>
    <footer class="footer">
      © <span data-year></span> Pinzom · Discover your next favorite bakery.
    </footer>
    <script src="bakery-catalog.js"></script>
    <script src="script.js"></script>
  </body>
</html>
