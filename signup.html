<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Sign Up | Pinzom</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .auth-visual img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
      }
    </style>
  </head>
  <body>
    <header class="container nav">
      <a class="logo" href="index.html">pinzom<span>•</span></a>
      <nav class="nav-links">
        <a class="" href="index.html">Discover</a>
        <a class="" href="how-it-works.html">How It Works</a>
        <a class="" href="explore.html">Explore</a>
        <a class="" href="categories.html">Categories</a>
        <a class="" href="reviews.html">Reviews</a>
      </nav>
      <input
        class="search"
        aria-label="Search bakeries"
        placeholder="⌕  Search bakeries near you"
      />
      <a class="login-link" href="login.html">Log in</a>
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        ☰
      </button>
    </header>
    <main>
      <section class="container auth">
        <div>
          <span class="eyebrow">📍 Bakeries near your campus</span>
          <h1>Find your next favorite bakery.</h1>
          <p>Sign up to create a new account.</p>
          <form class="form" data-form="signup" novalidate>
            <label for="fullName">Full name</label>
            <input
              id="fullName"
              name="fullName"
              placeholder="Full Name"
              autocomplete="name"
              maxlength="60"
              data-rule="fullName"
            />
            <small class="field-error" data-error-for="fullName"></small>
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@campus.edu"
              autocomplete="email"
              data-rule="email"
            />
            <small class="field-error" data-error-for="email"></small>
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              data-rule="newPassword"
            />
            <small class="field-error" data-error-for="password"></small>
            <label
              ><input
                type="checkbox"
                name="terms"
                style="width: auto"
                data-rule="terms"
              />
              I agree to Pinzom's Terms and Privacy Policy</label
            >
            <small class="field-error" data-error-for="terms"></small>
            <button class="btn" type="submit">Create free account</button>
            <div class="form-msg" role="status" aria-live="polite"></div>
          </form>
          <p>
            Already have an account?
            <a href="login.html" style="color: #d92d6c">Log in</a>
          </p>
        </div>
        <div class="auth-visual">
          <img src="images/signup.png" alt="Fresh bakery treats" />
        </div>
      </section>
    </main>
    <footer class="footer">
      © <span data-year></span> Pinzom · Discover your next favorite bakery.
    </footer>
    <script src="script.js"></script>
  </body>
</html>
